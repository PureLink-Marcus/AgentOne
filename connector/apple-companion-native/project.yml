name: AgentOneCompanion
options:
  bundleIdPrefix: solutions.mwart
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
targets:
  AgentOneCompanion:
    type: application
    platform: iOS
    sources: [AgentOneCompanion]
    info:
      path: AgentOneCompanion/Info.plist
    entitlements:
      path: AgentOneCompanion/AgentOneCompanion.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: solutions.mwart.agentone.companion
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
    dependencies: []
